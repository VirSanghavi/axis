name: Axis CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bunx eslint . --max-warnings=0

    - name: Typecheck
      run: bunx tsc --noEmit

    - name: Run full test suite
      run: bun test

    - name: Run concurrency load test
      run: bun tests/load-test.ts
